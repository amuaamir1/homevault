name: HomeVault Development Validation

run-name: Validate ${{ github.ref_name }} @ ${{ github.sha }}

'on':
  push:
    branches:
      - develop
      - 'develop*'
      - 'develop/**'
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homevault-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Validate CI inputs
        shell: bash
        env:
          FLUTTER_VERSION: ${{ vars.FLUTTER_VERSION }}
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$FLUTTER_VERSION" || {
            echo "::error::Repository variable FLUTTER_VERSION is missing."
            exit 1
          }

          test -n "$FIREBASE_OPTIONS_DART_BASE64" || {
            echo "::error::GitHub secret FIREBASE_OPTIONS_DART_BASE64 is missing."
            exit 1
          }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          cache: true

      - name: Restore Firebase Dart configuration
        shell: bash
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p lib
          printf '%s' "$FIREBASE_OPTIONS_DART_BASE64" \
            | base64 --decode > lib/firebase_options.dart
          test -s lib/firebase_options.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

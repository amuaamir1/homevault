name: HomeVault Developer Release

run-name: HomeVault developer release from ${{ github.sha }}

'on':
  push:
    branches:
      - develop
      - develop*
      - develop/**
  workflow_dispatch:
    
permissions:
  contents: write


env:
  GDRIVE_RELEASE_DIR: ${{ vars.GDRIVE_RELEASE_DIR || 'Projects-Works/HomeVault/Releases' }}
concurrency:
  group: homevault-release-publishing
  cancel-in-progress: false
  queue: max

jobs:
  release:
    name: Test, sign, build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout developer commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: P15 source safety gate
        shell: bash
        run: python3 scripts/ci/homevault_ci.py validate-source

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate CI configuration
        shell: bash
        env:
          FLUTTER_VERSION: ${{ vars.FLUTTER_VERSION }}
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GDRIVE_RCLONE_CONFIG_BASE64: ${{ secrets.GDRIVE_RCLONE_CONFIG_BASE64 }}
        run: python3 scripts/ci/homevault_ci.py validate-ci --mode developer-release

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          cache: true

      - name: Restore Firebase configuration
        shell: bash
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          mkdir -p lib android/app

          printf '%s' "$FIREBASE_OPTIONS_DART_BASE64" \
            | base64 --decode > lib/firebase_options.dart

          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" \
            | base64 --decode > android/app/google-services.json

          test -s lib/firebase_options.dart
          test -s android/app/google-services.json

          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          expected = "homevault-aamir-india-1701"
          google = json.loads(Path("android/app/google-services.json").read_text())
          actual_google = google["project_info"]["project_id"]
          dart = Path("lib/firebase_options.dart").read_text()
          dart_projects = set(re.findall(r"projectId\s*:\s*['\"]([^'\"]+)['\"]", dart))

          if actual_google != expected or expected not in dart_projects:
              raise SystemExit("Developer release Firebase configuration is not the HomeVault development project.")
          PY

      - name: Restore Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          mkdir -p android/app

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/app/homevault-release.jks

          test -s android/app/homevault-release.jks

          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/android/app/homevault-release.jks"
          } > android/key.properties
          
      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f android/key.properties
          for key in storePassword keyPassword keyAlias storeFile; do
            value="$(grep "^${key}=" android/key.properties | cut -d= -f2-)"
            if [ -z "$value" ]; then
              echo "::error::android/key.properties has an empty '${key}'."
              echo "::error::Check the ANDROID_* repository secrets."
              exit 1
            fi
          done
          echo "Release signing configuration is present."
          
      - name: Calculate release identifiers from latest published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          # ---------------------------------------------------------
          # Read the semantic version from source.
          #
          # Example:
          # version: 1.12.2+17
          #
          # CI controls the +build number.
          # The developer controls 1.12.2 / 1.13.0 / etc.
          # ---------------------------------------------------------

          pubspec_path = Path("pubspec.yaml")
          pubspec = pubspec_path.read_text(encoding="utf-8")

          version_match = re.search(
              r"(?m)^version:\s*([^+\s]+)\+(\d+)\s*$",
              pubspec,
          )

          if not version_match:
              raise SystemExit(
                  "pubspec.yaml must contain a version such as "
                  "'version: 1.12.2+17'."
              )

          version_name = version_match.group(1)
          checked_in_build = int(version_match.group(2))

          # ---------------------------------------------------------
          # Read checked-in R number as fallback only.
          # ---------------------------------------------------------

          build_info_path = Path("lib/core/app_build_info.dart")
          build_info = build_info_path.read_text(encoding="utf-8")

          release_match = re.search(
              r"static const String releaseNumber = 'R(\d+)';",
              build_info,
          )

          if not release_match:
              raise SystemExit(
                  "Could not find AppBuildInfo.releaseNumber in "
                  "lib/core/app_build_info.dart."
              )

          checked_in_release = int(release_match.group(1))

          # ---------------------------------------------------------
          # Prevent accidentally publishing the same commit twice.
          # ---------------------------------------------------------

          current_sha = os.environ["GITHUB_SHA"]

          tag_result = subprocess.run(
              [
                  "git",
                  "tag",
                  "--points-at",
                  current_sha,
              ],
              check=True,
              capture_output=True,
              text=True,
          )

          existing_homevault_tags = [
              tag.strip()
              for tag in tag_result.stdout.splitlines()
              if tag.strip().lower().startswith("homevault-beta-")
          ]

          if existing_homevault_tags:
              raise SystemExit(
                  "This commit already has a HomeVault release tag: "
                  + ", ".join(existing_homevault_tags)
              )

          # ---------------------------------------------------------
          # Get successfully PUBLISHED GitHub releases.
          #
          # Failed workflow runs do not create a GitHub Release,
          # therefore they do not consume a build/R number.
          # ---------------------------------------------------------

          release_result = subprocess.run(
              [
                  "gh",
                  "release",
                  "list",
                  "--limit",
                  "100",
                  "--json",
                  "tagName,publishedAt,isDraft,isPrerelease",
              ],
              check=True,
              capture_output=True,
              text=True,
          )

          releases = json.loads(release_result.stdout)

          # Expected HomeVault tag:
          #
          # homevault-beta-v1.12.2-build19-R08
          #
          tag_pattern = re.compile(
              r"^homevault-beta-v.+-build"
              r"(?P<build>\d+)-R(?P<release>\d+)$",
              re.IGNORECASE,
          )

          published_homevault_releases = []

          for release in releases:
              if release.get("isDraft"):
                  continue

              published_at = release.get("publishedAt")

              if not published_at:
                  continue

              tag_name = release.get("tagName", "")
              match = tag_pattern.match(tag_name)

              if not match:
                  continue

              published_homevault_releases.append(
                  {
                      "tag": tag_name,
                      "publishedAt": published_at,
                      "build": int(match.group("build")),
                      "release": int(match.group("release")),
                  }
              )

          # ---------------------------------------------------------
          # Calculate next BUILD and R number.
          # ---------------------------------------------------------

          if published_homevault_releases:
              latest = max(
                  published_homevault_releases,
                  key=lambda item: item["publishedAt"],
              )

              previous_build = latest["build"]
              previous_release = latest["release"]

              print("")
              print(
                  "Latest successfully published HomeVault release:"
              )
              print(f"  {latest['tag']}")
              print(f"  Build: {previous_build}")
              print(f"  Release: R{previous_release:02d}")
          else:
              # First CI-generated GitHub Release.
              previous_build = checked_in_build
              previous_release = checked_in_release

              print("")
              print(
                  "No previous CI-generated HomeVault release found."
              )
              print(
                  "Using checked-in build/release values as baseline."
              )
              print(f"  Build: {previous_build}")
              print(f"  Release: R{previous_release:02d}")

          build_number = previous_build + 1
          release_number = f"R{previous_release + 1:02d}"

          # ---------------------------------------------------------
          # Update pubspec.yaml inside CI workspace.
          # Nothing is committed back to Git.
          # ---------------------------------------------------------

          updated_pubspec, count = re.subn(
              r"(?m)^version:\s*[^\r\n]+$",
              f"version: {version_name}+{build_number}",
              pubspec,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "Could not update pubspec.yaml version."
              )

          pubspec_path.write_text(
              updated_pubspec,
              encoding="utf-8",
          )

          # ---------------------------------------------------------
          # Update AppBuildInfo inside CI workspace.
          # ---------------------------------------------------------

          replacements = (
              (
                  r"static const String version = '[^']*';",
                  f"static const String version = '{version_name}';",
                  "AppBuildInfo.version",
              ),
              (
                  r"static const String buildNumber = '[^']*';",
                  f"static const String buildNumber = '{build_number}';",
                  "AppBuildInfo.buildNumber",
              ),
              (
                  r"static const String releaseNumber = '[^']*';",
                  f"static const String releaseNumber = "
                  f"'{release_number}';",
                  "AppBuildInfo.releaseNumber",
              ),
          )

          for pattern, replacement, label in replacements:
              build_info, count = re.subn(
                  pattern,
                  replacement,
                  build_info,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      f"Could not update {label}."
                  )

          display_pattern = (
              r"static const String versionAndRelease"
              r"\s*=\s*'[^']*';"
          )

          if re.search(display_pattern, build_info):
              build_info = re.sub(
                  display_pattern,
                  "static const String versionAndRelease =\n"
                  "      'v$version+$buildNumber - "
                  "$releaseNumber';",
                  build_info,
                  count=1,
              )

          build_info_path.write_text(
              build_info,
              encoding="utf-8",
          )

          # ---------------------------------------------------------
          # Generate release names.
          # ---------------------------------------------------------

          apk_name = (
              f"HomeVault-Beta-v{version_name}"
              f"+{build_number}-{release_number}.apk"
          )

          tag_name = (
              f"homevault-beta-v{version_name}-"
              f"build{build_number}-{release_number}"
          )

          # ---------------------------------------------------------
          # Export for following workflow steps.
          # ---------------------------------------------------------

          github_env = Path(os.environ["GITHUB_ENV"])

          with github_env.open(
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"VERSION_NAME={version_name}\n"
              )
              output.write(
                  f"BUILD_NUMBER={build_number}\n"
              )
              output.write(
                  f"RELEASE_NUMBER={release_number}\n"
              )
              output.write(
                  f"APK_NAME={apk_name}\n"
              )
              output.write(
                  f"TAG_NAME={tag_name}\n"
              )

          print("")
          print("======================================")
          print(" HomeVault release candidate")
          print("======================================")
          print(f" Branch  : {os.environ['GITHUB_REF_NAME']}")
          print(f" Version : {version_name}")
          print(f" Build   : {build_number}")
          print(f" Release : {release_number}")
          print(f" APK     : {apk_name}")
          print(f" Tag     : {tag_name}")
          print("======================================")
          PY

      - name: Show tool versions
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version

      - name: Resolve dependencies without upgrades
        run: flutter pub get

      - name: Verify deterministic lockfile
        run: python3 scripts/ci/homevault_ci.py validate-lock

      - name: Check formatting
        shell: bash
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Automated tests
        run: flutter test

      - name: Build signed development release APK
        shell: bash
        env:
          HOMEVAULT_FIREBASE_PROJECT_ID: homevault-aamir-india-1701
          HOMEVAULT_ALLOW_NON_PROD_RELEASE: 'true'
          HOMEVAULT_PRIVACY_POLICY_URL: https://homevault-prod-in-2026-a1.web.app/privacy
          HOMEVAULT_TERMS_OF_SERVICE_URL: https://homevault-prod-in-2026-a1.web.app/terms
          HOMEVAULT_ACCOUNT_DELETION_URL: https://homevault-prod-in-2026-a1.web.app/delete-account
          HOMEVAULT_SUPPORT_EMAIL: support.homevault1@gmail.com
        run: |
          set -euo pipefail
          flutter build apk \
            --release \
            --build-name="$VERSION_NAME" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=HOMEVAULT_ENV=development \
            --dart-define=HOMEVAULT_FIREBASE_PROJECT_ID="$HOMEVAULT_FIREBASE_PROJECT_ID" \
            --dart-define=HOMEVAULT_ALLOW_NON_PROD_RELEASE=true \
            --dart-define=HOMEVAULT_PRIVACY_POLICY_URL="$HOMEVAULT_PRIVACY_POLICY_URL" \
            --dart-define=HOMEVAULT_TERMS_OF_SERVICE_URL="$HOMEVAULT_TERMS_OF_SERVICE_URL" \
            --dart-define=HOMEVAULT_ACCOUNT_DELETION_URL="$HOMEVAULT_ACCOUNT_DELETION_URL" \
            --dart-define=HOMEVAULT_SUPPORT_EMAIL="$HOMEVAULT_SUPPORT_EMAIL"
      - name: Verify signed APK
        shell: bash
        run: >-
          python3 scripts/ci/homevault_ci.py verify-artifact
          --kind apk
          --path build/app/outputs/flutter-apk/app-release.apk
          --version "$VERSION_NAME"
          --build "$BUILD_NUMBER"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$APK_NAME"
          python3 scripts/ci/homevault_ci.py generate-assets \
            --dist dist \
            --artifact "dist/$APK_NAME" \
            --environment development \
            --prerelease true
          ls -lh dist/

      - name: FINAL RELEASE GATE
        shell: bash
        run: python3 scripts/ci/homevault_ci.py final-gate --dist dist --require-aab false

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeVault-${{ env.RELEASE_NUMBER }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload release assets to Google Drive
        shell: bash
        env:
          GDRIVE_RCLONE_CONFIG_BASE64: ${{ secrets.GDRIVE_RCLONE_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          RCLONE_CONFIG_FILE="$RUNNER_TEMP/homevault-rclone.conf"
          cleanup_rclone_config() { rm -f "$RCLONE_CONFIG_FILE"; }
          trap cleanup_rclone_config EXIT
          printf '%s' "$GDRIVE_RCLONE_CONFIG_BASE64" | base64 --decode > "$RCLONE_CONFIG_FILE"
          chmod 600 "$RCLONE_CONFIG_FILE"
          test -s "$RCLONE_CONFIG_FILE"
          rclone --config "$RCLONE_CONFIG_FILE" listremotes | grep -qx 'gdrive:' || {
            echo "::error::Google Drive configuration must contain an rclone remote named 'gdrive'."
            exit 1
          }
          DRIVE_DESTINATION="gdrive:${GDRIVE_RELEASE_DIR}"
          rclone --config "$RCLONE_CONFIG_FILE" mkdir "$DRIVE_DESTINATION"
          rclone --config "$RCLONE_CONFIG_FILE" copy dist "$DRIVE_DESTINATION" --stats-one-line
          echo "Google Drive folder: ${GDRIVE_RELEASE_DIR}" >> "$GITHUB_STEP_SUMMARY"
          echo "Release manifest: release-manifest.json" >> "$GITHUB_STEP_SUMMARY"
          echo "Checksums: SHA256SUMS.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" \
            dist/* \
            --target "$GITHUB_SHA" \
            --title "HomeVault Beta $RELEASE_NUMBER - v$VERSION_NAME+$BUILD_NUMBER" \
            --notes-file dist/RELEASE_NOTES.md \
            --prerelease

      - name: Collect P15 failure diagnostics
        if: failure()
        shell: bash
        run: python3 scripts/ci/homevault_ci.py diagnostics --out p15-diagnostics

      - name: Upload P15 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HomeVault-P15-diagnostics-${{ github.run_id }}
          path: p15-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup restored signing and Firebase files
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties android/app/homevault-release.jks
          rm -f android/app/google-services.json lib/firebase_options.dart

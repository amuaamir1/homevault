name: HomeVault Manual Release

run-name: >-
  HomeVault manual release from ${{ inputs.source_ref }}

'on':
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch, tag, or commit SHA to release'
        required: true
        default: 'develop'
        type: string
      prerelease:
        description: 'Publish as a GitHub prerelease'
        required: true
        default: true
        type: boolean

permissions:
  contents: write


env:
  GDRIVE_RELEASE_DIR: ${{ vars.GDRIVE_RELEASE_DIR || 'Projects-Works/HomeVault/Releases' }}
concurrency:
  group: homevault-release-publishing
  cancel-in-progress: false
  queue: max

jobs:
  release:
    name: Test, sign, build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Resolve source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_REF="${{ inputs.source_ref }}"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_REF=$SOURCE_REF" >> "$GITHUB_ENV"
          echo "Building source ref: $SOURCE_REF"
          echo "Resolved commit: $SOURCE_SHA"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Validate CI configuration
        shell: bash
        env:
          FLUTTER_VERSION: ${{ vars.FLUTTER_VERSION }}
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GDRIVE_RCLONE_CONFIG_BASE64: ${{ secrets.GDRIVE_RCLONE_CONFIG_BASE64 }}
        run: |
          set -euo pipefail

          test -n "$FLUTTER_VERSION" || {
            echo "::error::Repository variable FLUTTER_VERSION is missing."
            exit 1
          }

          for name in \
            FIREBASE_OPTIONS_DART_BASE64 \
            GOOGLE_SERVICES_JSON_BASE64 \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_STORE_PASSWORD \
            ANDROID_KEY_PASSWORD \
            ANDROID_KEY_ALIAS \
            GDRIVE_RCLONE_CONFIG_BASE64
          do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions secret $name is missing."
              exit 1
            fi
          done

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ vars.FLUTTER_VERSION }}
          cache: true

      - name: Restore Firebase configuration
        shell: bash
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p lib android/app
          printf '%s' "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          test -s lib/firebase_options.dart
          test -s android/app/google-services.json

      - name: Restore Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/homevault-release.jks
          test -s android/app/homevault-release.jks

          {
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/android/app/homevault-release.jks"
          } > android/key.properties

      - name: Verify release signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f android/key.properties
          for key in storePassword keyPassword keyAlias storeFile; do
            value="$(grep "^${key}=" android/key.properties | cut -d= -f2-)"
            if [ -z "$value" ]; then
              echo "::error::android/key.properties has an empty '${key}'."
              echo "::error::Check the ANDROID_* repository secrets."
              exit 1
            fi
          done
          echo "Release signing configuration is present."
          
      - name: Calculate next build and release number
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          pubspec_path = Path("pubspec.yaml")
          pubspec = pubspec_path.read_text(encoding="utf-8")

          version_match = re.search(
              r"(?m)^version:\s*([^+\s]+)\+(\d+)\s*$",
              pubspec,
          )
          if not version_match:
              raise SystemExit(
                  "pubspec.yaml must contain a version such as "
                  "'version: 1.13.0+18'."
              )

          version_name = version_match.group(1)
          checked_in_build = int(version_match.group(2))

          build_info_path = Path("lib/core/app_build_info.dart")
          build_info = build_info_path.read_text(encoding="utf-8")

          release_match = re.search(
              r"static const String releaseNumber = 'R(\d+)';",
              build_info,
          )
          if not release_match:
              raise SystemExit(
                  "Could not find AppBuildInfo.releaseNumber in "
                  "lib/core/app_build_info.dart."
              )

          checked_in_release = int(release_match.group(1))
          source_sha = os.environ["SOURCE_SHA"]

          tag_result = subprocess.run(
              ["git", "tag", "--points-at", source_sha],
              check=True,
              capture_output=True,
              text=True,
          )
          existing_homevault_tags = [
              tag.strip()
              for tag in tag_result.stdout.splitlines()
              if tag.strip().lower().startswith("homevault-beta-")
              or tag.strip().lower().startswith("homevault-release-")
          ]
          if existing_homevault_tags:
              raise SystemExit(
                  "This source commit already has a HomeVault release tag: "
                  + ", ".join(existing_homevault_tags)
              )

          result = subprocess.run(
              [
                  "gh",
                  "release",
                  "list",
                  "--limit",
                  "100",
                  "--json",
                  "tagName,publishedAt,isDraft,isPrerelease",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          releases = json.loads(result.stdout)

          # Supports the existing beta tag convention and the new stable prefix:
          # homevault-beta-v1.13.0-build19-R08
          # homevault-release-v1.13.0-build19-R08
          tag_pattern = re.compile(
              r"^homevault-(?:beta|release)-v.+-build"
              r"(?P<build>\d+)-R(?P<release>\d+)$",
              re.IGNORECASE,
          )

          candidates = []
          for release in releases:
              if release.get("isDraft") or not release.get("publishedAt"):
                  continue
              match = tag_pattern.match(release.get("tagName", ""))
              if not match:
                  continue
              candidates.append(
                  {
                      "tag": release["tagName"],
                      "publishedAt": release["publishedAt"],
                      "build": int(match.group("build")),
                      "release": int(match.group("release")),
                  }
              )

          if candidates:
              latest = max(candidates, key=lambda item: item["publishedAt"])
              last_published_build = latest["build"]
              last_published_release = latest["release"]
              print(f"Latest published release: {latest['tag']}")
              print(f"Latest published build: {last_published_build}")
              print(f"Latest published R number: R{last_published_release:02d}")
          else:
              last_published_build = checked_in_build
              last_published_release = checked_in_release
              print("No matching published HomeVault release was found.")
              print("Using checked-in values as the initial baseline.")

          # Never generate a build lower than the source branch's checked-in value.
          baseline_build = max(last_published_build, checked_in_build)
          baseline_release = max(last_published_release, checked_in_release)
          build_number = baseline_build + 1
          release_number = f"R{baseline_release + 1:02d}"

          updated_pubspec, count = re.subn(
              r"(?m)^version:\s*[^\r\n]+$",
              f"version: {version_name}+{build_number}",
              pubspec,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update pubspec.yaml version.")
          pubspec_path.write_text(updated_pubspec, encoding="utf-8")

          replacements = (
              (
                  r"static const String version = '[^']*';",
                  f"static const String version = '{version_name}';",
                  "AppBuildInfo.version",
              ),
              (
                  r"static const String buildNumber = '[^']*';",
                  f"static const String buildNumber = '{build_number}';",
                  "AppBuildInfo.buildNumber",
              ),
              (
                  r"static const String releaseNumber = '[^']*';",
                  f"static const String releaseNumber = '{release_number}';",
                  "AppBuildInfo.releaseNumber",
              ),
          )
          for pattern, replacement, label in replacements:
              build_info, count = re.subn(
                  pattern,
                  replacement,
                  build_info,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Could not update {label}.")

          build_info_path.write_text(build_info, encoding="utf-8")

          prerelease = os.environ.get("PRERELEASE", "true").lower() == "true"
          prefix = "homevault-beta" if prerelease else "homevault-release"
          label = "Beta" if prerelease else "Release"

          apk_name = (
              f"HomeVault-{label}-v{version_name}"
              f"+{build_number}-{release_number}.apk"
          )
          tag_name = (
              f"{prefix}-v{version_name}-"
              f"build{build_number}-{release_number}"
          )

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
              output.write(f"VERSION_NAME={version_name}\n")
              output.write(f"BUILD_NUMBER={build_number}\n")
              output.write(f"RELEASE_NUMBER={release_number}\n")
              output.write(f"APK_NAME={apk_name}\n")
              output.write(f"TAG_NAME={tag_name}\n")
              output.write(f"RELEASE_LABEL={label}\n")

          print("")
          print("======================================")
          print(" HomeVault manual release candidate")
          print("======================================")
          print(f" Source ref : {os.environ['SOURCE_REF']}")
          print(f" Source SHA : {source_sha}")
          print(f" Version    : {version_name}")
          print(f" Build      : {build_number}")
          print(f" Release    : {release_number}")
          print(f" APK        : {apk_name}")
          print(f" Tag        : {tag_name}")
          print("======================================")
          PY

      - name: Show tool versions
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version
          java -version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        shell: bash
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Automated tests
        run: flutter test

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk \
            --release \
            --build-name="$VERSION_NAME" \
            --build-number="$BUILD_NUMBER"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$APK_NAME"
          (
            cd dist
            sha256sum "$APK_NAME" > "$APK_NAME.sha256.txt"
          )
          ls -lh "dist/$APK_NAME" "dist/$APK_NAME.sha256.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeVault-${{ env.RELEASE_NUMBER }}
          path: |
            dist/${{ env.APK_NAME }}
            dist/${{ env.APK_NAME }}.sha256.txt
          if-no-files-found: error
          retention-days: 30


      - name: Upload release assets to Google Drive
        shell: bash
        env:
          GDRIVE_RCLONE_CONFIG_BASE64: ${{ secrets.GDRIVE_RCLONE_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
      
          echo "Installing rclone..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
      
          RCLONE_CONFIG_FILE="$RUNNER_TEMP/homevault-rclone.conf"
      
          cleanup_rclone_config() {
            rm -f "$RCLONE_CONFIG_FILE"
          }
          trap cleanup_rclone_config EXIT
      
          printf '%s' "$GDRIVE_RCLONE_CONFIG_BASE64" \
            | base64 --decode > "$RCLONE_CONFIG_FILE"
      
          chmod 600 "$RCLONE_CONFIG_FILE"
          test -s "$RCLONE_CONFIG_FILE"
      
          if ! rclone \
            --config "$RCLONE_CONFIG_FILE" \
            listremotes | grep -qx 'gdrive:'; then
            echo "::error::Google Drive configuration must contain an rclone remote named 'gdrive'."
            exit 1
          fi
      
          DRIVE_DESTINATION="gdrive:${GDRIVE_RELEASE_DIR}"
      
          echo "Google Drive destination: ${GDRIVE_RELEASE_DIR}"
      
          rclone \
            --config "$RCLONE_CONFIG_FILE" \
            mkdir "$DRIVE_DESTINATION"
      
          rclone \
            --config "$RCLONE_CONFIG_FILE" \
            copyto \
            "dist/$APK_NAME" \
            "$DRIVE_DESTINATION/$APK_NAME" \
            --drive-chunk-size 64M \
            --stats-one-line
      
          rclone \
            --config "$RCLONE_CONFIG_FILE" \
            copyto \
            "dist/$APK_NAME.sha256.txt" \
            "$DRIVE_DESTINATION/$APK_NAME.sha256.txt" \
            --stats-one-line
      
          echo "Google Drive upload completed."
      
          echo "Google Drive folder: ${GDRIVE_RELEASE_DIR}" >> "$GITHUB_STEP_SUMMARY"
      
          echo "APK: ${APK_NAME}" >> "$GITHUB_STEP_SUMMARY"
      
          echo "SHA-256: ${APK_NAME}.sha256.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          args=(
            release create "$TAG_NAME"
            "dist/$APK_NAME"
            "dist/$APK_NAME.sha256.txt"
            --target "$SOURCE_SHA"
            --title "HomeVault $RELEASE_LABEL $RELEASE_NUMBER - v$VERSION_NAME+$BUILD_NUMBER"
            --generate-notes
          )

          if [ "${{ inputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"

      - name: Release summary
        if: always()
        shell: bash
        run: |
          {
            echo "## HomeVault manual release"
            echo ""
            echo "- Source ref: \`${SOURCE_REF:-unknown}\`"
            echo "- Source SHA: \`${SOURCE_SHA:-unknown}\`"
            echo "- Version: \`${VERSION_NAME:-unknown}\`"
            echo "- Build: \`${BUILD_NUMBER:-unknown}\`"
            echo "- Release: \`${RELEASE_NUMBER:-unknown}\`"
            echo "- Tag: \`${TAG_NAME:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"

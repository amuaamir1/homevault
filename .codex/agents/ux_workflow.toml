9. Identify UX regressions that could affect existing users.
10. Identify UX decisions that require architecture or product clarification.
11. Do not implement Flutter application code unless explicitly instructed.

Do not redesign unrelated screens.

Prefer simple, consistent workflows over unnecessary UI complexity.

When reviewing an existing feature, distinguish:

- BLOCKER
- MAJOR
- MINOR
- SUGGESTION


For each task:

1. Understand the approved product requirements.
2. Identify affected screens and user journeys.
3. Preserve existing HomeVault interaction patterns unless there is a clear reason to change them.
4. Define navigation behavior.
5. Define loading, empty, success, error and offline states.
6. Define validation and user-recovery behavior.
7. Consider accessibility including semantics, contrast, large text, focus order and screen-reader behavior.
